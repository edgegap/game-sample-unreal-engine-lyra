; Append to Config/DefaultEngine.ini of your Lyra project (UE 5.8). See README.md.

[/Script/BuildSettings.BuildSettings]
DefaultServerTarget=LyraServer

; Epic Online Services + Edgegap
; EOS is always on (Lyra's Config/Custom/EOS layer is not staged into packaged builds).
; Secrets do not belong here:
;   - the game client's EOS ClientSecret goes in Config/UserEngine.ini (git-ignored, still packaged),
;   - the dedicated server's EOS client comes from the EOS_SERVER_CLIENT_ID/SECRET variables on the
;     Edgegap app version (EdgegapEOSServerConfig module), and must never ship to players.
; ---------------------------------------------------------------------------------------------

[OnlineSubsystem]
DefaultPlatformService=EOS

[OnlineSubsystemEOS]
bEnabled=true

[/Script/OnlineSubsystemEOS.EOSSettings]
CacheDir=CacheDir
TickBudgetInMilliseconds=0
bEnableOverlay=True
bEnableSocialOverlay=True
bEnableEditorOverlay=True
bUseEAS=True
bUseEOSConnect=True
; No -AUTH_TYPE on the command line: try the saved Epic login, then the Epic account portal in the browser.
bPreferPersistentAuth=True
DefaultArtifactName=LyraEdgegap
!Artifacts=ClearArray
+Artifacts=(ArtifactName="LyraEdgegap",ClientId="YOUR_EOS_GAME_CLIENT_ID",ClientSecret="YOUR_EOS_CLIENT_SECRET",ProductId="YOUR_EOS_PRODUCT_ID",SandboxId="YOUR_EOS_SANDBOX_ID",DeploymentId="YOUR_EOS_DEPLOYMENT_ID",EncryptionKey="YOUR_EOS_ENCRYPTION_KEY")

[/Script/Engine.Engine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SocketSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="BeaconNetDriver",DriverClassName="/Script/SocketSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[/Script/CommonUser.CommonUserBasicPresence]
bEnableSessionsBasedPresence=true
PresenceStatusInGame=Status_InGame
PresenceStatusMainMenu=Status_MainMenu
PresenceStatusMatchmaking=Status_Matchmaking
PresenceKeyGameMode=game_mode
PresenceKeyMapName=map_name

; Online hosting goes through the Edgegap matchmaker; the dedicated server registers the EOS session.
; MatchmakerUrl (quoted) and AuthToken come from the Edgegap dashboard; set them in Config/UserEngine.ini.
[/Script/EdgegapIntegration.EdgegapSessionSubsystem]
bEnableMatchmaking=True
MatchmakerUrl="YOUR_MATCHMAKER_URL"
AuthToken=YOUR_MATCHMAKER_AUTH_TOKEN
bSendBeaconLatencies=True
bUseLobbiesDefault=False
bUseLobbiesVoiceChatDefault=False
bUseBeacons=False
DefaultProfile=controlpoint
!PlaylistProfiles=ClearArray
+PlaylistProfiles=(Playlist="DA_Convolution_ControlPoint",Profile="controlpoint")
+PlaylistProfiles=(Playlist="DA_Expanse_TDM",Profile="elimination")
+PlaylistProfiles=(Playlist="DA_TopDownArena_Multiplayer",Profile="topdown")
